# XcodeGen spec. Run `xcodegen generate` in this folder to create QTranslator.xcodeproj.
name: QTranslator
options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    PRODUCT_NAME: Q-Translator
    PRODUCT_BUNDLE_IDENTIFIER: com.yishulabs.qtranslator
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  QTranslator-iOS:
    type: application
    platform: iOS
    sources:
      - Shared
      - iOS
    settings:
      base:
        INFOPLIST_FILE: iOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        # 真机安装需要你自己的 Apple 开发团队 ID：QTRANSLATOR_TEAM_ID=XXXXXXXXXX xcodegen generate
        DEVELOPMENT_TEAM: ${QTRANSLATOR_TEAM_ID}
        CODE_SIGN_STYLE: Automatic
    scheme: {}
  QTranslator-macOS:
    type: application
    platform: macOS
    sources:
      - Shared
      - macOS
    settings:
      base:
        INFOPLIST_FILE: macOS/Info.plist
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
    scheme: {}
